<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0836" />
      <stop offset="60%" stop-color="#090114" />
      <stop offset="100%" stop-color="#020005" />
    </radialGradient>

    <!-- Golden Shimmer Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Rainbow Chakra Spectral Gradient -->
    <linearGradient id="chakraSpectral" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="16%" stop-color="#ea580c" />
      <stop offset="33%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="66%" stop-color="#06b6d4" />
      <stop offset="83%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Disc -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Concentric Orbit Rings -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#chakraSpectral)" stroke-width="3" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.5" />

  <!-- 16 Radiating Sacred Lotus Petals -->
  <g transform="translate(256, 256)">
    <!-- 8 Primary Petals -->
    <path d="M 0 -210 C 25 -160 30 -110 0 -90 C -30 -110 -25 -160 0 -210 Z" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 0 -210 C 25 -160 30 -110 0 -90 C -30 -110 -25 -160 0 -210 Z" transform="rotate(45)" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 0 -210 C 25 -160 30 -110 0 -90 C -30 -110 -25 -160 0 -210 Z" transform="rotate(90)" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 0 -210 C 25 -160 30 -110 0 -90 C -30 -110 -25 -160 0 -210 Z" transform="rotate(135)" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 0 -210 C 25 -160 30 -110 0 -90 C -30 -110 -25 -160 0 -210 Z" transform="rotate(180)" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 0 -210 C 25 -160 30 -110 0 -90 C -30 -110 -25 -160 0 -210 Z" transform="rotate(225)" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 0 -210 C 25 -160 30 -110 0 -90 C -30 -110 -25 -160 0 -210 Z" transform="rotate(270)" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 0 -210 C 25 -160 30 -110 0 -90 C -30 -110 -25 -160 0 -210 Z" transform="rotate(315)" fill="url(#goldGrad)" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Inner Mid Ring with Chakra Jewels -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5" />

    <!-- 7 Chakra Energy Spheres -->
    <!-- Sahasrara (Top - Purple) -->
    <circle cx="0" cy="-140" r="10" fill="#a855f7" filter="url(#glow)" />
    <!-- Ajna (Indigo) -->
    <circle cx="112" cy="-84" r="10" fill="#6366f1" filter="url(#glow)" />
    <!-- Visuddha (Sky Cyan) -->
    <circle cx="136" cy="35" r="10" fill="#06b6d4" filter="url(#glow)" />
    <!-- Anahata (Heart Emerald) -->
    <circle cx="62" cy="125" r="10" fill="#10b981" filter="url(#glow)" />
    <!-- Manipura (Solar Gold) -->
    <circle cx="-62" cy="125" r="10" fill="#eab308" filter="url(#glow)" />
    <!-- Svadhisthana (Sacral Orange) -->
    <circle cx="-136" cy="35" r="10" fill="#f97316" filter="url(#glow)" />
    <!-- Muladhara (Root Crimson) -->
    <circle cx="-112" cy="-84" r="10" fill="#ef4444" filter="url(#glow)" />

    <!-- Sacred Shatkona (Interlaced Triangles of Shiva & Shakti) -->
    <polygon points="0,-95 82,48 -82,48" fill="rgba(168,85,247,0.12)" stroke="url(#goldGrad)" stroke-width="3" />
    <polygon points="0,95 82,-48 -82,-48" fill="rgba(239,68,68,0.12)" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Golden Central Bindu (Cosmic Seed) -->
    <circle cx="0" cy="0" r="30" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
  </g>

  <!-- Ambient Light Bloom Overlay -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#chakraSpectral)" stroke-width="1.5" stroke-opacity="0.3" />
</svg>
